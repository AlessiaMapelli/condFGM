<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Function_Definitions</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         max-width:860px;margin:40px auto;padding:0 20px;line-height:1.6;color:#24292e}
    h1,h2,h3,h4,h5,h6{margin-top:24px;margin-bottom:8px;font-weight:600}
    h1{font-size:2em;border-bottom:1px solid #eaecef;padding-bottom:8px}
    h2{font-size:1.5em;border-bottom:1px solid #eaecef;padding-bottom:6px}
    code{background:#f6f8fa;padding:2px 5px;border-radius:3px;
         font-family:"SFMono-Regular",Consolas,monospace;font-size:.9em}
    pre{background:#f6f8fa;padding:16px;border-radius:6px;overflow-x:auto}
    pre code{background:none;padding:0;font-size:.85em}
    table{border-collapse:collapse;width:100%;margin:16px 0}

    th{background:#f6f8fa;font-weight:600}
    tr:nth-child(even){background:#f9f9f9}
    a{color:#0366d6;text-decoration:none}
    a:hover{text-decoration:underline}
